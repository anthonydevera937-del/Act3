<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #validationMessage {
            color: red;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #orderSummary {
            margin-top: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>MINI STORE CHECKOUT SYSTEM</h2>
        
        <div id="validationMessage"></div>

        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter customer name">
        </div>

        <div class="form-group">
            <label for="productCount">Number of Products</label>
            <input type="number" id="productCount" min="1" placeholder="Enter number of products">
        </div>

        <button type="button" id="generateFieldsBtn">Generate Product Fields</button>

        <div id="productsContainer"></div>

        <div class="form-group">
            <label for="deliveryOption">Delivery Option</label>
            <select id="deliveryOption">
                <option value="1">1 - Store Pickup (₱0)</option>
                <option value="2">2 - Standard Delivery (₱80)</option>
                <option value="3">3 - Express Delivery (₱150)</option>
            </select>
        </div>

        <button type="button" id="calculateBtn">Calculate Order</button>

        <h3>Order Summary</h3>
        <div id="orderSummary"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
